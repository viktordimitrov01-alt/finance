<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Фінанси">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="icon.png">
<title>Фінанси</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f3;--tx:#161616;--hint:#8a8a8e;--ac:#2563eb;--pos:#1f9d63;--neg:#d9534f;--sep:#e6e6e3}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1d;--bg2:#0b0b0c;--tx:#f2f2f2;--ac:#5b8def;--sep:#2c2c2f}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;background:var(--bg2);color:var(--tx);padding:calc(14px + env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}button:active{opacity:.55}
h1{font-size:22px;font-weight:700;margin:6px 4px 14px}h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--hint);margin:22px 4px 8px;font-weight:600}
.hero{padding:14px 4px 4px}.hero .num{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:2px 0 6px}.hero .mo{display:flex;gap:12px;font-size:14px;flex-wrap:wrap}
.card{background:var(--bg);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:inset 0 -.5px 0 var(--sep)}
h2+.card,.hero+.card{border-radius:16px 16px 0 0}.card:not(:has(+.card)){border-radius:0 0 16px 16px;box-shadow:none}h2+.card:not(:has(+.card)){border-radius:16px}
.l{display:flex;align-items:center;gap:12px}.ic{width:38px;height:38px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:18px}
.sub{color:var(--hint);font-size:13px;margin-top:2px}.big{font-size:17px;font-weight:600}.r{text-align:right}
.neg{color:var(--neg)}.pos{color:var(--pos)}.void{opacity:.4;text-decoration:line-through}
.empty{text-align:center;color:var(--hint);padding:48px 0 24px;line-height:1.7;font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -.5px 0 var(--sep)}
.nav button{background:none;border:0;color:var(--hint);font-size:10px;padding:4px 6px}.nav button.on{color:var(--ac);font-weight:600}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px #0003}
#sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end}
#sheet>div{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
#sheetbox::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--sep);margin:0 auto 14px}
input,select{width:100%;font-size:17px;padding:12px 14px;border-radius:12px;border:0;background:var(--bg2);color:var(--tx);margin:6px 0;outline:0}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:8px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-size:15px;color:var(--hint)}.seg .on{background:var(--bg);color:var(--tx);font-weight:600;box-shadow:0 1px 3px #0001}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:0;background:var(--bg2);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:15px}.chip.on{background:var(--ac);color:#fff}
.btn{width:100%;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:17px;font-weight:600;padding:14px;margin-top:12px}.btn.g{background:var(--bg);color:var(--ac)}
.link{background:none;border:0;color:var(--ac);font-size:13px;padding:4px 0}
.amt{font-size:40px;font-weight:700;text-align:center;background:none;margin:2px 0 10px}
.warn{background:#ff9f0a22;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.stats{display:flex;gap:8px;margin:14px 0 4px}.stat{flex:1;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--hint)}.stat b{display:block;font-size:15px;margin-top:3px;color:var(--tx)}
.chart{background:var(--bg);border-radius:16px;padding:14px 12px 8px;margin-top:8px}.chart svg{width:100%;display:block}
.bi{fill:var(--pos)}.be{fill:var(--neg)}.lb{fill:var(--hint);font-size:9px}
.grp{border-radius:16px;overflow:hidden;background:var(--bg)}.rw{padding:11px 16px;box-shadow:inset 0 -.5px 0 var(--sep)}
.rt{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:7px}.tr{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}.tr i{display:block;height:100%;border-radius:3px}
details.g{background:var(--bg);border-radius:16px;margin-bottom:8px;overflow:hidden}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}summary::-webkit-details-marker{display:none}
summary .l{flex:1}.chev{color:var(--hint);font-size:22px;transition:transform .2s}details[open] .chev{transform:rotate(90deg)}
details .card{border-radius:0!important;box-shadow:inset 0 .5px 0 var(--sep)!important}
.inl{display:flex;gap:8px;align-items:center}.inl input{flex:1}.sgn{width:52px;height:46px;border:0;border-radius:12px;background:var(--bg2);color:var(--ac);font-size:20px;font-weight:700}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
</style></head><body>
<div id="app"></div>
<button class="fab" onclick="addTx()" aria-label="Додати запис">+</button>
<nav class="nav"><button id="t-home" onclick="go('home')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg>Рахунки</button>
<button id="t-hist" onclick="go('hist')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Історія</button>
<button id="t-rep" onclick="go('rep')"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Звіт</button>
<button id="t-cats" onclick="go('cats')"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Категорії</button>
<button id="t-bk" onclick="go('bk')"><svg viewBox="0 0 24 24"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg>Копія</button></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetbox"></div></div>
<script>
const K='fin_v1',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={expense:['🛒 Продукти','🚌 Транспорт','🏠 Житло','☕ Кафе','🎮 Розваги',"💊 Здоров'я",'📦 Інше'],income:['💼 Зарплата','📈 Підробіток','🎁 Подарунок','📦 Інше']};
const ICON={cash:'💵',card:'💳',bank:'🏦'},r2=x=>Math.round(x*100)/100;
const money=(n,c)=>new Intl.NumberFormat('uk-UA',{style:'currency',currency:c}).format(n);
const now=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,19).replace('T',' ')};
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.accounts)return d}catch(e){const raw=localStorage.getItem(K);if(raw)localStorage.setItem(K+'_corrupt',raw)}
  const d={accounts:[],cats:[],tx:[],seq:1,lastExport:null};for(const t in DEF)DEF[t].forEach(n=>d.cats.push({id:d.seq++,type:t,name:n}));return d}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Не вдалося зберегти дані! Зробіть резервну копію.')}}
let D=load(),tab='home',F;
const bal=a=>r2(a.opening+D.tx.reduce((s,t)=>s+(t.acc===a.id?t.amount:0)+(t.xf&&t.to===a.id?t.amountTo:0),0));
const reversed=id=>D.tx.some(t=>t.rev===id),act=()=>D.accounts.filter(a=>!a.archived);
function go(t){tab=t;render()}
function render(){for(const t of['home','hist','rep','cats','bk'])$('t-'+t).className=tab===t?'on':'';$('app').innerHTML={home,hist,rep:reportView,cats:catsView,bk}[tab]()}
function home(){
  const tot={},fl={},m=now().slice(0,7),cur=id=>D.accounts.find(a=>a.id===id).currency;
  act().forEach(a=>tot[a.currency]=r2((tot[a.currency]||0)+bal(a)));
  D.tx.filter(t=>!t.rev&&!t.xf&&!t.adj&&!reversed(t.id)&&t.ts.slice(0,7)===m&&!D.accounts.find(a=>a.id===t.acc).archived).forEach(t=>{const c=cur(t.acc),f=fl[c]=fl[c]||{i:0,e:0};t.amount>0?f.i+=t.amount:f.e-=t.amount});
  let h='';
  const days=D.lastExport?(Date.now()-new Date(D.lastExport))/864e5:Infinity;
  if(D.tx.length&&days>30)h+='<div class="warn">⚠️ Давно не було резервної копії. Дані лежать лише на цьому телефоні. Відкрийте вкладку «Копія».</div>';
  const cs=Object.keys(tot);
  h+=cs.map(c=>{const f=fl[c]||{i:0,e:0};return `<div class="hero"><div class="sub">Баланс · ${c}</div><div class="num ${tot[c]<0?'neg':''}">${money(tot[c],c)}</div><div class="mo"><span class="pos">↑ ${money(f.i,c)}</span><span class="neg">↓ ${money(f.e,c)}</span><span class="sub" style="margin:0">цього місяця</span></div></div>`}).join('');
  if(!act().length)h+='<div class="empty">👛<br>Створіть перший рахунок,<br>щоб почати</div>';
  if(act().length)h+='<h2>Рахунки</h2><div class="sub" style="margin:-4px 4px 8px">Розгорніть групу й натисніть на рахунок, щоб змінити назву, баланс або видалити</div>';h+=['cash','card','bank',''].map(k=>{const L=act().filter(a=>k?a.kind===k:!GN[a.kind]);if(!L.length)return'';
    const sm={};L.forEach(a=>sm[a.currency]=r2((sm[a.currency]||0)+bal(a)));
    return `<details class="g" ${G[k||'o']?'open':''} ontoggle="G['${k||'o'}']=this.open;saveUi()"><summary><span class="l"><span class="ic">${ICON[k]||'👛'}</span><span>${GN[k]||'Інше'}<span class="sub" style="display:block">рахунків: ${L.length}</span></span></span><span class="r big">${Object.entries(sm).map(([c,v])=>`<span class="${v<0?'neg':''}">${money(v,c)}</span>`).join('<br>')}</span><span class="chev">›</span></summary>${L.map(accRow).join('')}</details>`}).join('');
  return h+'<button class="btn" onclick="addAccount()">+ Новий рахунок</button>';
}
function amtHtml(t,a){
  if(!t.xf)return `<div class="r big ${t.amount<0?'neg':'pos'}" style="font-size:18px">${t.amount>0?'+':''}${money(t.amount,a.currency)}</div>`;
  const b=D.accounts.find(x=>x.id===t.to);
  return `<div class="r" style="font-size:16px;font-weight:700">${a.currency===b.currency?money(Math.abs(t.amount),a.currency):`<span class="neg">${money(t.amount,a.currency)}</span><br><span class="pos">+${money(t.amountTo,b.currency)}</span>`}</div>`}
function hist(){
  let h='<h1>Історія</h1><div class="sub" style="margin:-8px 4px 12px">Записи не видаляються. Помилку скасовує зворотний запис.</div>',day='';
  if(!D.tx.length)h+='<div class="empty">🧾<br>Записів ще немає</div>';
  [...D.tx].sort((x,y)=>y.ts.localeCompare(x.ts)||y.id-x.id).forEach(t=>{const d=t.ts.slice(0,10),a=D.accounts.find(x=>x.id===t.acc),c=D.cats.find(x=>x.id===t.cat),v=reversed(t.id);
    if(d!==day){day=d;h+=`<h2>${new Date(d+'T12:00').toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'})}</h2>`}
    h+=`<div class="card ${v?'void':''}"><div>${esc(t.xf?(t.rev?'↩ Скасування переказу':'↔ Переказ'):t.adj?'⚖ Коригування балансу':t.rev?'↩ Скасування':c?c.name:'—')}<div class="sub">${esc(t.xf?a.name+' → '+D.accounts.find(x=>x.id===t.to).name:a.name)} · ${t.ts.slice(11,16)}${t.note?' · '+esc(t.note):''}</div>
    ${!t.rev&&!v?`<button class="link" onclick="undo(${t.id})">Скасувати запис</button>`:''}</div>
    ${amtHtml(t,a)}</div>`});
  return h;
}
function bk(){
  return `<h1>Копія</h1><div class="card" style="display:block"><b>Дані зберігаються лише на цьому телефоні.</b><div class="sub">Якщо загубите або заміните телефон чи очистите дані Safari, без копії їх не відновити. Зберігайте файл у «Файлах», iCloud Drive або надсилайте собі.</div></div>
  <div class="sub" style="margin:8px 4px">Остання копія: ${D.lastExport?new Date(D.lastExport).toLocaleString('uk-UA'):'ще не було'} · записів: ${D.tx.length}</div>
  <button class="btn" onclick="exportData()">Зберегти резервну копію</button>
  <button class="btn g" onclick="$('imp').click()">Відновити з копії</button>
  <input id="imp" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])">`;
}
function sheet(h){$('sheetbox').innerHTML=h;$('sheet').style.display='flex'}
function closeSheet(){$('sheet').style.display='none'}
function undo(id){if(!confirm('Додати зворотний запис? Оригінал залишиться в історії.'))return;
  const t=D.tx.find(x=>x.id===id),n={id:D.seq++,ts:now(),rev:id};
  if(t.xf)Object.assign(n,{xf:true,acc:t.to,to:t.acc,amount:-t.amountTo,amountTo:-t.amount,note:'Скасування переказу #'+id});
  else Object.assign(n,{acc:t.acc,cat:t.cat,amount:-t.amount,note:'Скасування запису #'+id});
  D.tx.push(n);save();render()}
const R={p:'m',cur:null,t:'expense',data:null};
const PL={w:'останні 7 днів',m:'останні 30 днів',y:'останні 12 місяців',a:'за весь час'};
const lk=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function monthKeys(from,to){const k=[];let[y,m]=from.split('-').map(Number);const[Y,M]=to.split('-').map(Number);
  while(y<Y||(y===Y&&m<=M)){k.push(y+'-'+String(m).padStart(2,'0'));if(++m>12){m=1;y++}}return k}
function buckets(){
  const n=new Date(),cm=lk(n).slice(0,7);let keys=[],mode=10;
  if(R.p==='w'||R.p==='m'){for(let i=(R.p==='w'?6:29);i>=0;i--){const d=new Date(n);d.setDate(n.getDate()-i);keys.push(lk(d))}}
  else{let from;if(R.p==='y'){const d=new Date(n);d.setDate(1);d.setMonth(d.getMonth()-11);from=lk(d).slice(0,7)}else from=D.tx.map(t=>t.ts.slice(0,7)).sort()[0]||cm;
    keys=monthKeys(from,cm);mode=7;if(R.p==='a'&&keys.length>24){keys=[...new Set(keys.map(k=>k.slice(0,4)))];mode=4}}
  return{keys,mode}}
function setR(k,v){R[k]=v;render()}
function tip(i){const d=R.data,k=d.keys[i],f=d.mode===10?new Date(k+'T12:00').toLocaleDateString('uk-UA',{day:'numeric',month:'long'}):d.mode===7?new Date(k+'-15T12:00').toLocaleDateString('uk-UA',{month:'long',year:'numeric'}):k;
  $('tip').innerHTML=`<b>${f}</b> · <span class="pos">↑ ${money(d.inc[i],R.cur)}</span> · <span class="neg">↓ ${money(d.exp[i],R.cur)}</span>`}
function reportView(){
  const curs=[...new Set(act().map(a=>a.currency))];
  if(!curs.length)return '<h1>Звіт</h1><div class="empty">📊<br>Спершу створіть рахунок<br>і додайте кілька записів</div>';
  if(!curs.includes(R.cur))R.cur=curs[0];
  const{keys,mode}=buckets(),idx=Object.fromEntries(keys.map((k,i)=>[k,i])),inc=keys.map(()=>0),exp=keys.map(()=>0),cat={};
  D.tx.forEach(t=>{if(t.rev||t.xf||t.adj||reversed(t.id))return;const a=D.accounts.find(x=>x.id===t.acc);if(a.archived||a.currency!==R.cur)return;
    const i=idx[t.ts.slice(0,mode)];if(i===undefined)return;
    if(t.amount>0)inc[i]+=t.amount;else exp[i]-=t.amount;
    if((t.amount>0)===(R.t==='income'))cat[t.cat]=(cat[t.cat]||0)+Math.abs(t.amount)});
  R.data={keys,mode,inc,exp};
  const ti=r2(inc.reduce((a,b)=>a+b,0)),te=r2(exp.reduce((a,b)=>a+b,0)),seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${R[key]===v?'on':''}" onclick="setR('${key}','${v}')">${l}</button>`).join('')}</div>`;
  let h='<h1>Звіт</h1>'+seg('p',[['w','Тиждень'],['m','Місяць'],['y','Рік'],['a','Весь час']]);
  if(curs.length>1)h+=`<div class="chips" style="margin:0 0 4px">${curs.map(c=>`<button class="chip ${R.cur===c?'on':''}" onclick="setR('cur','${c}')">${c}</button>`).join('')}</div>`;
  h+=`<div class="sub" style="margin:0 4px">${PL[R.p]}</div><div class="stats"><div class="stat">Доходи<b class="pos">${money(ti,R.cur)}</b></div><div class="stat">Витрати<b class="neg">${money(te,R.cur)}</b></div><div class="stat">Баланс<b>${money(r2(ti-te),R.cur)}</b></div></div>`;
  if(!ti&&!te)return h+'<div class="empty">🧾<br>У цьому періоді записів немає</div>';
  const W=340,H=130,max=Math.max(1,...inc,...exp),gw=W/keys.length,bw=Math.min(14,gw*.38),step=keys.length>12?Math.ceil(keys.length/6):1;
  const lab=k=>mode===10?(R.p==='w'?new Date(k+'T12:00').toLocaleDateString('uk-UA',{weekday:'short'}):k.slice(8)):mode===7?new Date(k+'-15T12:00').toLocaleDateString('uk-UA',{month:'short'}):k;
  const bars=keys.map((k,i)=>{const x=i*gw+gw/2,hi=inc[i]/max*H,he=exp[i]/max*H;
    return `<rect class="bi" x="${x-bw-.5}" y="${H-hi}" width="${bw}" height="${hi}" rx="2"/><rect class="be" x="${x+.5}" y="${H-he}" width="${bw}" height="${he}" rx="2"/>${i%step===0?`<text class="lb" x="${x}" y="${H+14}" text-anchor="middle">${lab(k)}</text>`:''}<rect x="${i*gw}" y="0" width="${gw}" height="${H+18}" fill="transparent" onclick="tip(${i})"/>`}).join('');
  h+=`<h2>Динаміка</h2><div class="chart"><svg viewBox="0 0 ${W} ${H+20}"><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--sep)"/>${bars}</svg></div><div id="tip" class="sub" style="text-align:center;margin-top:8px;min-height:18px">Торкніться стовпчика, щоб побачити суми</div>`;
  const rows=Object.entries(cat).sort((a,b)=>b[1]-a[1]),tot=rows.reduce((s,r)=>s+r[1],0);
  h+=`<h2>За категоріями</h2>${seg('t',[['expense','Витрати'],['income','Доходи']])}`;
  h+=rows.length?`<div class="grp">${rows.map(([id,v])=>{const c=D.cats.find(x=>x.id==id),pc=v/tot;return `<div class="rw"><div class="rt"><span>${esc(c?c.name:'—')}</span><span>${money(r2(v),R.cur)} · ${Math.round(pc*100)}%</span></div><div class="tr"><i style="width:${pc*100}%;background:var(--${R.t==='income'?'pos':'neg'})"></i></div></div>`}).join('')}</div>`:'<div class="empty" style="padding:20px 0">Немає записів цього типу</div>';
  return h}
const GN={cash:'Готівка',card:'Картки',bank:'Банки'};
let G={};try{G=JSON.parse(localStorage.getItem('fin_ui'))||{}}catch(e){}
function saveUi(){try{localStorage.setItem('fin_ui',JSON.stringify(G))}catch(e){}}
const accRow=a=>{const b=bal(a);return `<div class="card" onclick="editAccount(${a.id})" style="cursor:pointer"><div><div>${esc(a.name)}</div><div class="sub">${a.currency}</div></div><div class="big ${b<0?'neg':''}">${money(b,a.currency)}</div></div>`};
function flip(id){const i=$(id),v=i.value.trim();i.value=v.startsWith('-')?v.slice(1):'-'+v;i.focus()}
const EM=['🛒','🍔','🚌','🏠','💊','🎮','👕','🎁','✈️','📚','🐶','💼','📈','💰'];
function editAccount(id){const a=D.accounts.find(x=>x.id===id);
  sheet(`<h2 style="margin-top:0">Рахунок · ${a.currency}</h2>
  <div class="sub" style="margin:0 4px">Назва</div><input id="en" value="${esc(a.name)}" maxlength="30">
  <button class="btn g" onclick="renameAccount(${id})">Зберегти назву</button>
  <div class="sub" style="margin:16px 4px 0">Баланс рахунку, ${a.currency}</div>
  <div class="inl"><input id="eb" type="text" inputmode="decimal" value="${bal(a)}"><button class="sgn" onclick="flip('eb')">±</button></div>
  <input id="ebn" placeholder="Причина (необов'язково)" maxlength="100">
  <button class="btn" onclick="adjustBalance(${id})">Змінити баланс</button>
  <div class="sub" style="margin:8px 4px 0">Різниця запишеться в історію як коригування, а не як дохід чи витрата.</div>
  <button class="btn g" style="color:var(--neg);margin-top:20px" onclick="delAccount(${id})">Видалити рахунок</button>`)}
function adjustBalance(id){const a=D.accounts.find(x=>x.id===id),v=parseFloat($('eb').value.replace(',','.'));
  if(isNaN(v))return $('eb').focus();
  const cur=bal(a),d=r2(v-cur);if(!d){closeSheet();return}
  if(!confirm(`«${a.name}»: ${money(cur,a.currency)} → ${money(r2(v),a.currency)}\nВ історію додасться коригування ${d>0?'+':''}${money(d,a.currency)}.`))return;
  D.tx.push({id:D.seq++,adj:true,acc:id,amount:d,note:$('ebn').value.trim().slice(0,100),ts:now()});save();closeSheet();render()}
function renameAccount(id){const n=$('en').value.trim().slice(0,30);if(!n)return;D.accounts.find(x=>x.id===id).name=n;save();closeSheet();render()}
function delAccount(id){const a=D.accounts.find(x=>x.id===id),used=D.tx.some(t=>t.acc===id||t.to===id),b=bal(a);
  const msg=used?`Рахунок «${a.name}» зникне зі списку, але його записи залишаться в історії.${b?` Його баланс (${money(b,a.currency)}) більше не враховуватиметься в підсумках.`:''} Продовжити?`:`Видалити порожній рахунок «${a.name}»?`;
  if(!confirm(msg))return;
  if(used)a.archived=true;else D.accounts=D.accounts.filter(x=>x.id!==id);save();closeSheet();render()}
function catsView(){
  let h='<h1>Категорії</h1>';
  for(const [t,title] of [['expense','Витрати'],['income','Доходи']])
    h+=`<h2>${title}</h2>`+D.cats.filter(c=>c.type===t&&!c.archived).map(c=>`<div class="card" onclick="catSheet(${c.id})" style="cursor:pointer">${esc(c.name)}<span class="sub" style="margin:0">›</span></div>`).join('')+`<button class="btn g" onclick="catSheet(0,'${t}')">+ Нова категорія</button>`;
  return h}
function catSheet(id,type){const c=id?D.cats.find(x=>x.id===id):null,t=c?c.type:type;
  sheet(`<h2 style="margin-top:0">${c?'Категорія':'Нова категорія · '+(t==='income'?'доходи':'витрати')}</h2>
  <input id="cn" placeholder="Назва" maxlength="30" value="${esc(c?c.name:'')}">
  <div class="chips">${EM.map(e=>`<button class="chip" onclick="setEmoji('${e}')">${e}</button>`).join('')}</div>
  <button class="btn" onclick="saveCat(${id||0},'${t}')">Зберегти</button>
  ${c?`<button class="btn g" style="color:var(--neg)" onclick="delCat(${id})">Видалити категорію</button>`:''}`)}
function setEmoji(e){const i=$('cn');i.value=e+' '+i.value.replace(/^[^\p{L}\p{N}]+/u,'')}
function saveCat(id,type){const n=$('cn').value.trim().slice(0,30);if(!n)return;
  if(id)D.cats.find(x=>x.id===id).name=n;else D.cats.push({id:D.seq++,type,name:n});save();closeSheet();render()}
function delCat(id){const c=D.cats.find(x=>x.id===id),used=D.tx.some(t=>t.cat===id);
  if(!confirm(used?`Категорія «${c.name}» зникне зі списку, але старі записи збережуть її назву.`:`Видалити категорію «${c.name}»?`))return;
  if(used)c.archived=true;else D.cats=D.cats.filter(x=>x.id!==id);save();closeSheet();render()}
function addAccount(){
  sheet(`<h2 style="margin-top:0">Новий рахунок</h2><input id="an" placeholder="Назва (напр. Моно, Гаманець)" maxlength="30">
  <div class="seg" id="ak">${Object.entries({cash:'Готівка',card:'Картка',bank:'Банк'}).map(([k,v],i)=>`<button data-k="${k}" class="${i?'':'on'}" onclick="pickKind(this)">${v}</button>`).join('')}</div>
  <select id="ac">${['UAH','USD','EUR','PLN','GBP','CZK','CHF'].map(c=>`<option>${c}</option>`).join('')}</select>
  <div class="inl"><input id="ao" type="text" inputmode="decimal" placeholder="Початковий баланс (можна відʼємний)"><button class="sgn" onclick="flip('ao')">±</button></div>
  <button class="btn" onclick="saveAccount()">Створити</button>`)}
function pickKind(b){[...b.parentNode.children].forEach(x=>x.className='');b.className='on'}
function saveAccount(){const name=$('an').value.trim();if(!name)return;
  D.accounts.push({id:D.seq++,name,kind:document.querySelector('#ak .on').dataset.k,currency:$('ac').value,opening:r2(parseFloat($('ao').value.replace(',','.'))||0)});save();closeSheet();render()}
function addTx(){if(!act().length)return addAccount();F={type:'expense',cat:null,acc:act()[0].id};txSheet();$('amt').focus()}
function txSheet(){
  const A=act();
  if(F.type==='transfer'&&A.length<2){alert('Для переказу потрібно щонайменше два рахунки.');F.type='expense'}
  const xf=F.type==='transfer',keep=['amt','amt2','note','dt'].map(i=>$(i)?.value||''),from=A.find(a=>a.id===F.acc);
  if(xf&&(F.to===undefined||F.to===F.acc))F.to=A.find(a=>a.id!==F.acc).id;
  const opt=sel=>A.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${ICON[a.kind]||''} ${esc(a.name)} · ${a.currency}</option>`).join('');
  const seg=`<div class="seg">${[['expense','Витрата'],['income','Дохід'],['transfer','Переказ']].map(([t,l])=>`<button class="${F.type===t?'on':''}" onclick="F.type='${t}';F.cat=null;txSheet()">${l}</button>`).join('')}</div>`;
  if(xf){const to=A.find(a=>a.id===F.to);
    sheet(`${seg}<input id="amt" class="amt" type="number" inputmode="decimal" placeholder="0 ${from.currency}" value="${keep[0]}">
    <div class="sub" style="margin:4px 4px 0">З рахунку</div><select onchange="F.acc=+this.value;txSheet()">${opt(F.acc)}</select>
    <div class="sub" style="margin:4px 4px 0">На рахунок</div><select onchange="F.to=+this.value;txSheet()">${opt(F.to)}</select>
    ${to.currency!==from.currency?`<div class="sub" style="margin:4px 4px 0">Скільки зарахується (${to.currency})</div><input id="amt2" type="number" inputmode="decimal" placeholder="0 ${to.currency}" value="${keep[1]}">`:''}
    <div class="sub" style="margin:4px 4px 0">Дата</div><input id="dt" type="date" max="${lk(new Date())}" value="${keep[3]||lk(new Date())}"><input id="note" placeholder="Коментар (необов'язково)" maxlength="200" value="${esc(keep[2])}"><button class="btn" onclick="saveTx()">Зберегти</button>`);return}
  const cats=D.cats.filter(c=>c.type===F.type&&!c.archived);
  sheet(`${seg}<input id="amt" class="amt" type="number" inputmode="decimal" placeholder="0 ${from.currency}" value="${keep[0]}">
  <select onchange="F.acc=+this.value;txSheet()">${opt(F.acc)}</select>
  <div class="chips">${cats.map(c=>`<button class="chip ${F.cat===c.id?'on':''}" onclick="F.cat=${c.id};txSheet()">${esc(c.name)}</button>`).join('')}<button class="chip" onclick="newCat()">＋</button></div>
  <div class="sub" style="margin:4px 4px 0">Дата</div><input id="dt" type="date" max="${lk(new Date())}" value="${keep[3]||lk(new Date())}"><input id="note" placeholder="Коментар (необов'язково)" maxlength="200" value="${esc(keep[2])}"><button class="btn" onclick="saveTx()">Зберегти</button>`)}
function newCat(){const name=(prompt('Назва категорії (можна з емодзі)')||'').trim().slice(0,30);if(!name)return;
  const c={id:D.seq++,type:F.type,name};D.cats.push(c);F.cat=c.id;save();txSheet()}
function saveTx(){
  const num=id=>parseFloat(($(id)?.value||'').replace(',','.')),v=num('amt');if(!(v>0))return $('amt').focus();
  const dv=$('dt').value,td=lk(new Date()),ts=dv&&dv<td?dv+' 12:00:00':now();
  if(F.type==='transfer'){
    const a=D.accounts.find(x=>x.id===F.acc),b=D.accounts.find(x=>x.id===F.to);let w=v;
    if(a.currency!==b.currency){w=num('amt2');if(!(w>0))return $('amt2').focus()}
    D.tx.push({id:D.seq++,xf:true,acc:a.id,to:b.id,amount:-r2(v),amountTo:r2(w),note:$('note').value.slice(0,200),ts});
  }else{
    if(!F.cat)return alert('Оберіть категорію');
    D.tx.push({id:D.seq++,acc:F.acc,cat:F.cat,amount:r2(F.type==='income'?v:-v),note:$('note').value.slice(0,200),ts});
  }
  save();closeSheet();render()}
async function exportData(){
  D.lastExport=new Date().toISOString();save();
  const name=`finance-backup-${now().slice(0,10)}.json`,file=new File([JSON.stringify(D)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});render();return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();render()}
async function importData(f){
  if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){return alert('Це не схоже на файл копії.')}
  if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.cats)||!Array.isArray(d.tx)||!d.seq)return alert('Це не схоже на файл копії.');
  if(!confirm(`Замінити поточні дані копією? У копії: рахунків ${d.accounts.length}, записів ${d.tx.length}.`))return;
  localStorage.setItem(K+'_before_import',localStorage.getItem(K)||'');D=d;save();render();alert('Готово, дані відновлено.')}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
